# Build the VitePress site and deploy it to GitHub Pages.
#
# One-time setup (repository admin): Settings → Pages → Build and deployment
# → Source: GitHub Actions.
#
# The repository is public. Pages is already set to GitHub Actions, and the
# site is public at https://pietruszka.github.io/factory/. A Pages site limited
# to repository readers requires a GitHub Enterprise Cloud organization. This
# repository is a user account, so making the repo private would not hide the
# published site.

name: Deploy docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Jobs below set their own permissions. Unspecified scopes are none.
permissions:
  contents: read

# Publishing runs share `pages`. A newer publish waits, and an in-progress
# deploy is not cancelled. Pull-request builds use a separate group so they
# cannot cancel a pending publish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # upload-pages-artifact uses actions/upload-artifact. With explicit
      # permissions, artifact upload needs actions: write.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run docs:build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Deploy
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
