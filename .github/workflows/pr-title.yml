# Reject pull request titles that miss type(FAC-N): summary.
#
# shortcut: runs the script from the PR branch, so that branch can weaken
# the check; move it to a ruleset if that starts to matter.

name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node --experimental-strip-types scripts/check-pr-title.ts
